<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>TrainMind · 手机尺寸预览</title>
<style>
  body{margin:0;background:#1b1b1b;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#ddd;
       display:flex;align-items:center;justify-content:center;gap:32px;min-height:100vh;flex-wrap:wrap;padding:24px}
  .frame{width:390px;height:844px;background:#000;border-radius:44px;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);position:relative;flex:0 0 auto}
  .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#000;border-radius:14px;z-index:2}
  iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff;display:block}
  .side{max-width:330px}
  h1{font-size:15px;margin:0 0 12px;color:#fff;letter-spacing:.02em}
  p{margin:0 0 10px;color:#9a9a9a;font-size:13px}
  a{color:#c8f560;text-decoration:none}
  code{background:#2a2a2a;padding:1px 5px;border-radius:4px;font-size:12px;color:#ddd}
  .tip{border-left:2px solid #c8f560;padding-left:10px;margin-top:16px;color:#8a8a8a;font-size:12px}
</style></head>
<body>
  <div class="frame"><div class="notch"></div>
    <iframe id="screen" src="http://localhost:3000/?user=demo-investor"></iframe>
  </div>
  <div class="side">
    <h1>TrainMind · iPhone 尺寸预览（390 × 844）</h1>
    <p>左边就是 App 在手机上的实际布局。可以正常点击、输入、走完一场训练。</p>
    <p>换用户：<a href="#" onclick="document.getElementById('screen').src='http://localhost:3000/?user=demo-investor';return false">demo-investor</a> ·
       <a href="#" onclick="document.getElementById('screen').src='http://localhost:3000/?user=demo-user';return false">demo-user</a></p>
    <p>不满意 390 宽？直接改本文件里的 <code>.frame</code> 宽高（例如 375×812 是 iPhone X/XS）。</p>
    <div class="tip">
      这不是 iOS 原生 App，Xcode 模拟器看不到它——<br>
      要看真机：<code>./start-7b3.sh --mobile</code>，手机与电脑同一 Wi-Fi，<br>
      用终端打印的访问口令打开；Android 也可以 <code>adb reverse tcp:3100 tcp:3000</code>。
    </div>
  </div>
  <script>
    // 大小自适应：窗口太矮时整体缩小，避免上下被裁
    const fit = () => { const f = document.querySelector('.frame');
      const s = Math.min(1, (window.innerHeight - 60) / 868); f.style.transform = `scale(${s})`; f.style.transformOrigin = 'center'; };
    fit(); addEventListener('resize', fit);
  </script>
</body></html>
