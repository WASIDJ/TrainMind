    voiceState='idle';voiceCaption='这次没读出声音，按屏幕上的提示继续就行。';voiceUI();scheduleAutoListen()};
    synth.resume();synth.speak(utterance);

  resume(){window.speechSynthesis?.resume()}

class NetworkTtsProvider{
  constructor(){this.name='network-tts';this.epoch=0;this.audio=null;this.lastText='';this.available=true;this.url=null}

    if(recognition)stopListening();
    const fallback=()=>{if(epoch!==this.epoch)return;this.epoch++;webSpeechTts.play(text,onDone)};
    if(!this.available)return fallback();

    // (这段时间用户说话完全没反应)。加 8 秒超时,超时走本地合成兜底。

        audio.onerror=()=>{URL.revokeObjectURL(url);this.url=null;fallback()};
        voiceState='speaking';voiceUI();
        await audio.play();
      })
      .catch(()=>fallback());
  }
  pause(){this.audio?.pause()}
  resume(){this.audio?.play()}
  stop(){this.epoch++;if(this.audio){try{this.audio.pause();this.audio.removeAttribute('src')}catch{}this.audio=null}

    if(this.url){try{URL.revokeObjectURL(this.url)}catch{}this.url=null}

}

// 打卡日历(owner 2026-11-09 要求,参照"路径+完成格子"):只用真实完成的场次点灯。
// 明确不抄断签惩罚(streak freeze/repair)——
// 断了就从今天重新开始,不给压力。
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
async function renderCheckin(){
  const host=document.querySelector('#checkin');if(!host)return;
  try{
    const [h,pr]=await Promise.all([
      api('/api/history?userId='+encodeURIComponent(userId)),
      api('/api/progress?userId='+encodeURIComponent(userId))
    ]);
    if(!host.isConnected)return;
    const doneDays=new Set((h.sessions||[]).map(x=>dayKey(x.record?.completedAt||x.record?.startedAt)));
    const cells=[];
    for(let i=27;i>=0;i--){
      const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);
      const k=dayKey(d),on=doneDays.has(k),today=i===0;
      // 2026-11-11：点亮格原来用 var(--lime,#c8f560) 的豆绿、未点亮用 rgba(0,0,0,.07)（深色底上几乎看不见），
      // 一屏里两种绿并存。统一到强调色 + 暗底空格，今天用一个描边圈出来。
      cells.push('<span class="checkin-cell'+(on?' on':'')+(today?' today':'')+'" title="'+k+(on?' · 练了':' · 没练')+'"></span>');
    }
    const streak=pr.relationship?.streakWeeks??0,weekSessions=pr.volume?.thisWeek?.sessions??0;
    host.innerHTML='<div class="tm-note"><strong>打卡</strong><p>连续 '+streak+' 周 · 本周已练 '+weekSessions+' 场</p><div class="checkin-grid">'+cells.join('')+'</div><p class="home-suggestion" style="margin-top:8px">练完一场就亮一格。断了不用补签，从今天重新开始就行。</p></div>';
  }catch(e){host.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

// 日报是 Markdown。原样塞 <pre> 会把 "# 2026-11-11 训练日报" 和 "**25 分钟**" 一起端给用户。
// 只支持日报实际用到的子集（标题/引用/列表/加粗），先转义再放行格式，不引入第三方库。
function renderMarkdown(md){
  const inline=text=>esc(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const out=[];let list=null,tableHeader=false;
  const closeList=()=>{if(list){out.push('</'+list+'>');list=null}};
  for(const raw of String(md).split('\n')){
    const line=raw.trimEnd();
    if(!line.trim()){closeList();continue}
    const heading=line.match(/^(#{1,3})\s+(.*)$/);
    if(heading){closeList();const level=Math.min(3,heading[1].length+1);out.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>');continue}
    const quote=line.match(/^>\s?(.*)$/);
    if(quote){closeList();out.push('<p class="md-quote">'+inline(quote[1])+'</p>');continue}
    const image=line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);
    if(image){closeList();out.push('<figure class="md-figure"><img src="'+esc(image[2])+'" alt="'+esc(image[1])+'"><figcaption>'+inline(image[1])+'</figcaption></figure>');continue}
    const table=line.match(/^\|(.+)\|\s*$/);
    if(table){
      closeList();
      const cells=table[1].split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))){continue} // 分隔行 |---|---|
      const isHeader=!tableHeader;
      const tag=isHeader?'th':'td';
      if(isHeader){tableHeader=true;out.push('<table class="md-table"><tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>')}
      else out.push('<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');
      continue;
    }
    if(tableHeader){out.push('</table>');tableHeader=false}
    const bullet=line.match(/^[-*]\s+(.*)$/);
    if(bullet){if(list!=='ul'){closeList();out.push('<ul>');list='ul'}out.push('<li>'+inline(bullet[1])+'</li>');continue}
    closeList();out.push('<p>'+inline(line)+'</p>');
  }
  closeList();
  if(tableHeader)out.push('</table>');
  return out.join('');
}

async function renderMuscleLedger(screen){
  if(!screen)return;
  try{
    const d=await api('/api/muscles?userId='+encodeURIComponent(userId));
    if(!screen.isConnected||!Array.isArray(d.muscles))return;
    const tone={just_trained:'#ffb4a2',recovering:'#ffd9c9',recovered:'#b7dfb7',neglected:'#c9b8e8',no_record:'#6d6279'};
    const rowFor=m=>{
      const freq=m.frequencyText||m.text,detail=m.intervalStatus==='too_soon'?'今天刚练过':(m.recoveryPercent!=null&&m.state!=='no_record'?`恢复 ${m.recoveryPercent}%`:'');
      return '<div class="muscle-row" data-state="'+esc(m.state)+'">'
        +'<span class="muscle-dot" style="background:'+(tone[m.state]||'#6d6279')+'"></span>'
        +'<span class="muscle-name">'+esc(m.label)+'</span>'
        +'<span class="muscle-status">'+esc(freq)+(detail?'<small>'+esc(detail)+'</small>':'')+'</span>'
        +'<span class="muscle-sets"><strong>'+(m.sets7d||'—')+'</strong>'+(m.sets7d?'<small>组</small>':'')+'</span>'
        +'</div>';
    };
    // 2026-11-11：没记录的肌群原来各占一行、每行都写"本周还没练"，一屏里有 5 行废话。

    const active=d.muscles.filter(m=>m.state!=='no_record'),idle=d.muscles.filter(m=>m.state==='no_record');

    if(completed.length){const latest=completed[0];recent.className='tm-row';recent.innerHTML='<div><strong>'+esc(goalNames[latest.workout.goal]??'训练')+' · '+new Date(latest.record.completedAt).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+'</strong><small>完成 '+latest.workout.exercises.filter(x=>x.completedSets>0).length+' 个动作 · '+Math.round(latest.record.activeWorkoutMs/60000)+' 分钟</small></div><span class="chevron">›</span>';recent.setAttribute('role','button');recent.tabIndex=0;recent.onclick=()=>recordDetail(latest);recent.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();recent.click()}}}else recent.textContent='还没有训练记录。今天，从第一组开始。';
  }).catch(error=>{if(recent.isConnected)recent.textContent=error.message});
  const input=document.querySelector('#prompt'),count=document.querySelector('#prompt-count'),chips=[...document.querySelectorAll('[data-group] .chip')];
  function updateInput(){count.textContent=`${input.value.length}/200`;chips.forEach(b=>{const selected=input.value.includes(b.dataset.value);b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});document.querySelector('#duration-label').textContent=(input.value.match(/(\d+)\s*分钟/)?.[1]??30)+' 分钟'}
  input.oninput=updateInput;
  const showIntent=()=>{dashboard.hidden=true;document.querySelector('#intent-panel').hidden=false;document.querySelector('.shell').dataset.view='intent';document.querySelector('#intent-actions').hidden=false;document.querySelector('#home-mic').hidden=false;if(!input.value)input.value='30分钟，我在家，徒手自重，想练全身，精力充沛';updateInput();app.scrollTop=0};
  document.querySelector('#generate-plan').onclick=showIntent;document.querySelector('#submit-plan').onclick=()=>document.querySelector('#create').requestSubmit();
  // D27:入口放在"训练条件"面板里（情境化入口，不与主 CTA 并列抢位置）
  {
    const actions=document.querySelector('#intent-actions');
    if(actions&&!actions.querySelector('#import-entry')){
      const b=document.createElement('button');b.id='import-entry';b.type='button';b.className='secondary';b.textContent='导入别人的计划';
      b.onclick=importPage;actions.appendChild(b);
    }
  }
  for(const [id,step] of [['duration-minus',-5],['duration-plus',5]])document.querySelector('#'+id).onclick=()=>{const minutes=Math.max(5,Math.min(120,Number(input.value.match(/(\d+)\s*分钟/)?.[1]??30)+step));input.value=/\d+\s*分钟/.test(input.value)?input.value.replace(/\d+\s*分钟/,minutes+'分钟'):minutes+'分钟，'+input.value;updateInput()};
  if(intent===true)showIntent();else applyHomeCta();
// 一屏只有一个主 CTA —— 有课程就"继续下一场",
// 没有课程才"排今天的训练";第二条路降级成一行文字,不再和主按钮并列抢注意力。
async function applyHomeCta(){
  const btn=document.querySelector('#generate-plan'),hero=document.querySelector('.session-hero');
  if(!btn||!hero)return;
  try{
    const d=await api('/api/programs/active?userId='+encodeURIComponent(userId));
    if(!btn.isConnected||document.querySelector('.shell').dataset.screen!=='home')return;
    if(!d.program||!d.status?.nextSession)return;
    const st=d.status,h2=hero.querySelector('h2'),p=hero.querySelector('p');
    if(h2)h2.innerHTML='继续，<br>第 '+st.weekNumber+' 周';
    if(p)p.textContent=st.text;
    btn.innerHTML='继续这一场 <span aria-hidden="true">↗</span>';
    btn.onclick=async()=>{
      if(btn.disabled)return;btn.disabled=true;btn.textContent='正在准备…';
      try{const r=await api('/api/programs/'+encodeURIComponent(d.program.programId)+'/start',{userId});setWorkout(r.workout);render()}
      catch(e){btn.disabled=false;btn.innerHTML='继续这一场 <span aria-hidden="true">↗</span>';const er=document.querySelector('#error');if(er)er.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
    };
    const kicker=hero.querySelector('.session-kicker');
    if(kicker&&!hero.querySelector('#solo-link')){
      const link=document.createElement('button');
      link.id='solo-link';link.type='button';link.className='text-button';
      link.style.cssText='margin-top:10px;background:none;border:0;padding:0;font-size:13px;color:inherit;opacity:.65;cursor:pointer';
      link.textContent='今天不跟课程，单独排一场 ↗';
      link.onclick=()=>home(true);
      kicker.after(link);
    }
    // 平时的一句照面(2026-11-09):训练之外也在,但不催不考核。文案由规则产出(减重人群预设)。
    const nudge=document.querySelector('#nudge');
    if(nudge){
      api('/api/companion?userId='+encodeURIComponent(userId)).then(d=>{
        if(!nudge.isConnected||!d.checkIn)return;
        nudge.innerHTML='<div class="tm-note"><strong>教练说</strong><p>'+esc(d.checkIn.text)+'</p></div>';
      }).catch(()=>{});
    }
  }catch{}
}
  const homeMic=document.querySelector('#home-mic');
  homeMic.onclick=async()=>{
    if(offlineRecorder&&voiceInputTarget==='home'){offlineRecorder.finish(true);return}
    if(recognition&&voiceInputTarget==='home'){if(recognition.stop)recognition.stop();else stopListening();return}
    stopListening();voiceInputTarget='home';voiceEnabled=false;voiceState='starting';voiceCaption='正在打开麦克风…';voiceUI();
    // 不 await 能力探测:保持用户手势上下文(浏览器路径本身可用;Windows 服务器场景重点击一次即走离线识别)
    if(!input.isConnected||document.querySelector('.shell').dataset.screen!=='home')return;
    listen(false,(text,result)=>{
      if(!input.isConnected||document.querySelector('.shell').dataset.screen!=='home')return;
      stopListening();input.value=[input.value.trim(),text.trim()].filter(Boolean).join('，').slice(0,200);updateInput();
      voiceState='idle';voiceCaption=Number.isFinite(result?.confidence)&&result.confidence<0.45?'本次识别把握较低，请核对时间、地点和疼痛信息，修改后再生成计划。':'已写入训练需求，请核对时间、地点和疼痛信息后生成计划。';voiceUI();
    });
  };
  voiceUI();
  chips.forEach(b=>b.onclick=()=>{
    if(b.parentElement.dataset.group==='equipment'){
      const phrase=b.dataset.value,has=input.value.includes(phrase);
      input.value=(has?input.value.replace(phrase,''):input.value+'，'+phrase).replace(/[，,、]+/g,'，').replace(/^，|，$/g,'').slice(0,200);
      updateInput();document.querySelector('#error').innerHTML='';return;
    }
    const old=b.parentElement.querySelector('.chip.active'),selected=old===b?null:b;
    let rest=input.value;
    if(old)rest=rest.replace(old.dataset.value,'');
    const phrases=[...document.querySelectorAll('[data-group]')].map(g=>g===b.parentElement?selected?.dataset.value:g.querySelector('.chip.active')?.dataset.value).filter(Boolean);
    for(const phrase of phrases)rest=rest.replace(phrase,'');
    rest=rest.replace(/[，,、]+/g,'，').replace(/^\s*，\s*|\s*，\s*$/g,'').trim();
    input.value=[...phrases,rest].filter(Boolean).join('，').slice(0,200);updateInput();document.querySelector('#error').innerHTML='';
  });
  document.querySelector('#create').onsubmit=async e=>{
    e.preventDefault();const prompt=input.value.trim(),button=document.querySelector('#submit-plan');
    if(!prompt){const error=document.querySelector('#error');error.innerHTML='<div class="error">请先选择条件，或输入本次训练需求。</div>';error.scrollIntoView({block:'nearest'});return}
    if(button.disabled)return;button.disabled=true;button.textContent='正在生成计划…';stopListening();
    const stamp=viewStamp();const extra=extraNext;extraNext=false;try{const d=await api('/api/workouts/preview',{input:prompt,userId,experienceMode:'minimal',topic:'history',...(extra?{kind:'extra'}:{})});if(!currentView(stamp))return;setWorkout(d.workout);interpretation=d.interpretation;editingPlan=false;coachHistory=[];repProgressKey='';render()}
    catch(x){if(!currentView(stamp))return;const error=document.querySelector('#error');error.innerHTML=`<div class="error">${esc(x.message)}</div>`;error.scrollIntoView({block:'nearest'});button.disabled=false;button.textContent='生成训练计划'}
  };
}

document.querySelector('.avatar').textContent=userId.slice(0,1).toUpperCase();
document.querySelector('.appbar-date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
(async()=>{
  if(location.pathname==='/experiment')return experimentPage();
  if(location.pathname==='/community')return communityPage();
  home();
  voiceCapabilityPromise=api('/api/voice/status').then(result=>{offlineSpeechAvailable=result.offlineRecognition===true;voiceUI()}).catch(()=>{});
  if(SpeechRecognitionApi?.available){SpeechRecognitionApi.available({langs:['zh-CN'],processLocally:true}).then(result=>{localRecognitionReady=result==='available'}).catch(()=>{})}
  try{
    const d=await api(`/api/workouts/active?userId=${encodeURIComponent(userId)}`);
    if(!workout){setWorkout(d.workout);updateContinueCard();restoreTraining()}
  }catch{}
})();
